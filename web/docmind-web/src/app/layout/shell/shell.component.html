<a class="skip-link" href="#main-content">{{ 'layout.skipToContent' | transloco }}</a>

<mat-sidenav-container class="shell">
  <mat-sidenav
    class="sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="sidenavOpened()"
    [fixedInViewport]="isHandset()"
    [attr.aria-label]="'layout.mainNavigation' | transloco"
    (closedStart)="onDrawerClosed()"
  >
    <div class="sidenav-header">
      <a routerLink="/" class="brand" [attr.aria-label]="'layout.home' | transloco">
        <dm-logo />
      </a>
    </div>

    <nav [attr.aria-label]="'layout.mainNavigation' | transloco">
      <mat-nav-list>
        @for (item of navItems; track item.path) {
          <a
            mat-list-item
            [routerLink]="item.path"
            routerLinkActive="active-link"
            #link="routerLinkActive"
            [activated]="link.isActive"
            [attr.aria-current]="link.isActive ? 'page' : null"
          >
            <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.labelKey | transloco }}</span>
          </a>
        }
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <mat-toolbar class="toolbar">
      @if (isHandset()) {
        <button
          mat-icon-button
          type="button"
          (click)="toggleDrawer()"
          [attr.aria-label]="'layout.openNavigation' | transloco"
          [attr.aria-expanded]="drawerOpen()"
        >
          <mat-icon>menu</mat-icon>
        </button>
        <dm-logo />
      }

      <span class="spacer"></span>

      <dm-preferences-menu />
      <dm-user-menu />
    </mat-toolbar>

    <main id="main-content" class="main" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
