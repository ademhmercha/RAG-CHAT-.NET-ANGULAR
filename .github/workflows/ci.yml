name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DocMind.slnx

      - name: Build (warnings are errors)
        run: dotnet build DocMind.slnx --no-restore --configuration Release

      - name: Test (Testcontainers needs Docker, available on the runner)
        run: dotnet test --solution DocMind.slnx --no-build --configuration Release

  images:
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: src/DocMind.Api/Dockerfile
          - name: worker
            file: src/DocMind.Worker/Dockerfile
          - name: mcp
            file: src/DocMind.McpServer/Dockerfile
          - name: migrations
            file: Dockerfile.migrations
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
